<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hamulus</title>
<style>
  body { width: 340px; margin: 0; padding: 16px; font: 14px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif; color: #222; }
  h1 { display: flex; align-items: center; gap: 8px; font-size: 15px; margin: 0 0 12px; }
  .last { display: flex; gap: 12px; align-items: center; padding: 10px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 14px; }
  .last .score { font-size: 30px; font-weight: 700; }
  .last[hidden] { display: none; }
  .last.safe { background:#eef7ee } .last.caution { background:#fff6e0 } .last.danger { background:#fdeaea }
  .small { font-size: 12px; color: #666; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  td { padding: 4px 0; border-top: 1px solid #eee; vertical-align: top; }
  td.n { text-align: right; white-space: nowrap; }
  .err { color: #b71c1c; }
  button { margin-top: 12px; padding: 7px 12px; border-radius: 6px; border: 1px solid #bbb; background: #fafafa; cursor: pointer; }
</style>
</head>
<body>
  <h1><img id="icon" src="../icons/neutral-32.png" width="32" height="32" alt="">Hamulus</h1>
  <div id="last" class="last" hidden>
    <div class="score" id="score"></div>
    <div><div id="subject"></div><div class="small" id="sender"></div></div>
  </div>
  <div class="small">Blocklists (matched locally, nothing leaves your browser)</div>
  <table id="feeds"></table>
  <button id="sync">Refresh blocklists now</button>
  <script type="module" src="popup.js"></script>
</body>
</html>
